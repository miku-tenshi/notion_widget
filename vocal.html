<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live D-Day</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  :root{ --ink:#2b2140; --white:#fffdf6; --pink:#ff8fc7; --hot:#ff5f9a; --purple:#6b4fb3; --lav:#b9a6ff; --yellow:#ffe66d;
         --s1:#c9e4ff; --s2:#e0d6ff; --s3:#ffdcee; --floor:#ffeefa; --floor2:#f6dcff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Galmuri11','Galmuri9',ui-monospace,monospace;color:var(--white);overflow:hidden;position:relative;
       background:linear-gradient(180deg,var(--s1) 0 34%,var(--s2) 34% 68%,var(--s3) 68% 100%);-webkit-font-smoothing:none}
  body[data-p="2"]{--s1:#bfb0ff;--s2:#e9c6ff;--s3:#ffc9e3}
  body[data-p="3"]{--s1:#a99bff;--s2:#ff9edc;--s3:#ffe3ae}
  svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
  .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--floor);border-top:0}
  .floor::before{content:"";position:absolute;left:0;right:0;top:-8px;height:10px;background:
      radial-gradient(circle at 10px 10px,var(--floor) 9px,transparent 10px) 0 0/22px 10px repeat-x}
  .floor::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:var(--floor2)}
  .rainbow{position:absolute;left:3%;bottom:20%;width:30%;aspect-ratio:2/1;border-radius:999px 999px 0 0;display:none;
           background:radial-gradient(circle at 50% 100%,transparent 0 40%,#bdb2ff 40% 48%,#9bf6ff 48% 56%,#caffbf 56% 64%,#fdffb6 64% 72%,#ffd6a5 72% 80%,#ff9aa2 80% 88%,transparent 88%)}
  body[data-p="3"] .rainbow{display:block}
  .wrap{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:1fr auto auto;align-items:end;gap:3%;padding:10px 4% calc(22vh - 6px)}
  .card{align-self:center;justify-self:end;background:var(--ink);border:4px solid var(--white);
        box-shadow:0 0 0 4px var(--ink),6px 8px 0 4px rgba(90,63,158,.35);padding:12px 16px 14px;text-align:center;min-width:210px}
  .title{font-size:12px;color:var(--yellow);letter-spacing:1px}
  .dday{font-weight:700;font-size:clamp(34px,11vw,60px);line-height:1.05;margin:4px 0 2px;color:var(--white);text-shadow:3px 3px 0 var(--hot)}
  .goal{font-size:12px}
  .date{font-size:11px;color:var(--lav);margin-top:2px}
  .bar{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px}
  .bar b{color:var(--yellow);font-weight:400}
  .track{flex:1;height:8px;background:#3a3350;border:2px solid #120d22;position:relative}
  .track span{position:absolute;inset:0 auto 0 0;background:var(--pink);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
  .track i{position:absolute;top:-4px;width:6px;height:14px;background:var(--white);margin-left:-3px}
  .views{margin-top:8px;font-size:12px;color:#ffb0d6;display:flex;justify-content:space-between;gap:10px}
  .views em{font-style:normal;color:var(--white)}
  .msg{margin-top:8px;font-size:11px;color:var(--yellow);animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .hero{width:min(150px,28vw);margin-bottom:-2px;position:relative}
  .mic{width:min(34px,6vw);margin-bottom:-2px;position:relative;left:6px}
  .fx{position:absolute;inset:0;z-index:1;pointer-events:none}
  .fx>*{position:absolute;image-rendering:pixelated;animation:fl 3s steps(4) infinite}
  @keyframes fl{50%{transform:translateY(-6px)}}
  .big{position:absolute;right:5%;top:6px;z-index:3;font-size:clamp(20px,7vw,34px);color:#ff4d94;text-shadow:3px 3px 0 #fff;display:none}
  body[data-p="3"] .big{display:block}
  @media (max-width:430px){ .wrap{grid-template-columns:1fr;justify-items:center;align-items:center;padding:10px} .hero,.mic{display:none} .card{min-width:0;width:100%;justify-self:center} }
</style>
</head>
<body>
<div class="rainbow"></div><div class="floor"></div><div class="fx" id="fx"></div><div class="big" id="big">1M!</div>
<main class="wrap">
  <section class="card">
    <div class="title" id="title">FIRST LIVE</div>
    <div class="dday" id="dday">D-0</div>
    <div class="goal" id="goal"></div>
    <div class="date" id="date"></div>
    <div class="bar"><b>&#9654;</b><div class="track"><span id="bar"></span><i id="knob"></i></div></div>
    <div class="views"><span>&#9829; VIEWS</span><em id="views">0</em></div>
    <div class="msg" id="msg"></div>
  </section>
  <div class="mic" id="mic"></div>
  <div class="hero" id="hero"></div>
</main>
<script>
(() => {
  // ?title=FIRST%20LIVE&goal=...&date=2026-11-01&start=2026-10-12&views=1000000
  const q = new URLSearchParams(location.search);
  const cfg = { title:q.get('title')||'FIRST LIVE', goal:q.get('goal')||'논문 초안 완성', date:q.get('date')||'2026-11-01',
                start:q.get('start')||'2026-10-12', views:Number(q.get('views'))||1000000 };
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), DAY = 86400000;
  const target = parse(cfg.date), start = parse(cfg.start);
  const left = Math.round((target - today) / DAY);
  const total = Math.max(1, Math.round((target - start) / DAY));
  const prog = Math.min(1, Math.max(0, 1 - left / total));       // 0 -> 1
  const $ = id => document.getElementById(id);
  const p2 = n => String(n).padStart(2,'0');
  $('title').textContent = cfg.title; $('goal').textContent = cfg.goal;
  $('dday').textContent = left > 0 ? `D-${left}` : left === 0 ? 'D-DAY' : `D+${-left}`;
  $('date').textContent = `${target.getFullYear()}.${p2(target.getMonth()+1)}.${p2(target.getDate())}`;
  $('bar').style.width = $('knob').style.left = (prog*100) + '%';
  const views = Math.round(cfg.views * prog * prog);              // slow start, fast finish
  $('views').textContent = views.toLocaleString('en-US');
  $('msg').textContent = left > 0 ? (prog === 0 ? '▶ STANDBY...' : '▶ NOW PLAYING') : left === 0 ? '▶ LIVE START!' : '▶ ENCORE!';
  const phase = left <= 0 ? 3 : prog < 1/3 ? 0 : prog < 2/3 ? 1 : 2;      // 0..3
  document.body.dataset.p = phase + (phase === 0 ? 0 : 0);
  document.body.dataset.p = String(phase === 3 ? 3 : phase === 2 ? 2 : 1);

  // ---------- sprites
  const SP = {"plain": ["...k...........k...", "..kwk.........kwk..", "..kwpk.......kpwk..", "..kwwhhhhhhhhhwwk..", "..kwhwwwwwwwwwhwk..", "kkkhwwwwwwwwwwwhkkk", "kHkwwwewwwwwewwwkHk", "kHkwwwewwkwwewwwkHk", "khkwppwwwwwwwppwkhk", "kkkwwwwwkwkwwwwwkkk", "...kwwwwwwwwwwwk...", "....kkkkkkkkkkk....", ".....kwwwwwwwk.....", ".....kwwkkkwwk.....", ".....kkk...kkk....."], "sing": ["...k...........k...", "..kwk.........kwk..", "..kwpk.......kpwk..", "..kwwhhhhhhhhhwwk..", "..kwhwwwwwwwwwhwk..", "kkkhwwwwwwwwwwwhkkk", "kHkwwwewwwwwewwwkHk", "kHkwwwewwkwwewwwkHk", "khkwppwwwwwwwppwkhk", "kkkwwwwwkkkwwwwwkkk", "...kwwwwwpwwwwwk...", "....kkkkkkkkkkk....", ".....kwwwwwwwk.....", ".....kwwkkkwwk.....", ".....kkk...kkk....."], "happy": ["...k...........k...", "..kwk.........kwk..", "..kwpk.......kpwk..", "..kwwhhhhhhhhhwwk..", "..kwhwwwwwwwwwhwk..", "kkkhwwwwwwwwwwwhkkk", "kHkwwkwkwwwkwkwwkHk", "kHkwwwwwwwwwwwwwkHk", "khkwppwwwwwwwppwkhk", "kkkwwwwwkkkwwwwwkkk", "...kwwwwwpwwwwwk...", "....kkkkkkkkkkk....", ".....kwwwwwwwk.....", ".....kwwkkkwwk.....", ".....kkk...kkk....."]};
  const MIC = [".kkk.","kmmmk","kmwmk","kmmmk",".kkk.","..k..","..k..","..k.."];
  const N1 = ["..kk.","..k.k","..k..","..k..",".kk..","kkk..",".k..."];
  const N2 = ["..kkkkk","..kkkkk","..k...k","..k...k",".kk..kk","kkk.kkk",".k...k."];
  const HEART = [".h.h.","hhhhh","hhhhh",".hhh.","..h.."];
  const HEAD_PAL = {k:'#2b2140',w:'#fffdf6',p:'#ffa8c5',e:'#2b2140',h:'#ff8fc7',H:'#ffd1ea'};
  const svg = (rows, pal) => { let r=''; rows.forEach((row,y)=>[...row].forEach((c,x)=>{ if(c!=='.') r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[c]}"/>`; }));
    return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" xmlns="http://www.w3.org/2000/svg">${r}</svg>`; };
  const face = left <= 0 || phase >= 2 ? 'happy' : prog === 0 ? 'plain' : 'sing';
  $('hero').innerHTML = svg(SP[face], HEAD_PAL);
  $('mic').innerHTML = svg(MIC, {k:'#2b2140',m:'#ff8fc7',w:'#fffdf6'}).replace('viewBox="0 0 5 8"','viewBox="0 0 5 24"').replace('</svg>','<rect x="2" y="8" width="1" height="16" fill="#2b2140"/></svg>');

  // floating notes / hearts grow with progress
  const fx = $('fx'), cols = ['#ff6fae','#4cc9d6','#8f6bd9'];
  const slots = [[8,22],[20,16],[32,26],[12,46],[26,40],[38,46],[88,18],[90,44]];
  const items = ['n1','n2','n1','h','n2','h','n1','h'];
  const count = prog === 0 && left > 0 ? 0 : Math.min(8, 1 + Math.floor(prog * 7.99) + (left <= 0 ? 8 : 0));
  for (let i = 0; i < count; i++) {
    const [x,y] = slots[i], k = items[i];
    const el = document.createElement('div');
    el.style.cssText = `left:${x}%;top:${y + 10}%;width:${k==='n2'?28:k==='h'?24:22}px;animation-delay:${(i*.37).toFixed(2)}s`;
    const rows = k==='n1'?N1 : k==='n2'?N2 : HEART;
    const col = k==='h' ? '#ff5f9a' : cols[i%3];
    el.innerHTML = svg(rows, {k:col, h:col});
    fx.appendChild(el);
  }
})();
</script>
</body>
</html>
